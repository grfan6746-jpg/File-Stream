<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود - {{ server_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="theme-dark login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <span class="lock-icon">🔒</span>
        <h2>ورود به مدیا سرور تلویزیون</h2>
        <p>{{ server_name }}</p>
      </div>

      {% if error %}
        <div class="login-error-box">
          <span>⚠️ {{ error }}</span>
        </div>
      {% endif %}

      <form method="POST" action="{{ url_for('main.login') }}" class="login-form">
        <div class="form-group">
          <label for="username">نام کاربری:</label>
          <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="نام کاربری">
        </div>

        <div class="form-group">
          <label for="password">رمز عبور:</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="رمز عبور">
        </div>

        <button type="submit" class="action-btn btn-login-submit">ورود به سیستم</button>
      </form>
    </div>
  </div>
</body>
</html>
